[project]
name = "pocket-cloud"
version = "0.1.0"
description = "Self-hosted backend for Pocket Calendar and Pocket Notes"
requires-python = ">=3.12"
dependencies = [
    "croniter>=5.0,<7",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=14,<18",
]

[project.scripts]
pocket = "pocket_cloud.cli:main"
pocket-cloud = "pocket_cloud.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
