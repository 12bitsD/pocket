<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Clock</title>
  <!--
    Design history & aligned decisions (see docs/design-standard.md):
    - 2026-11-18: Agent 计划本质是定时向外部 Agent 投递 Prompt，不触发手机响铃。
    - 2026-11-23: 融合活字工单与终端命令骨相；轻字重 SF Mono + 苹方双字体，仅用「朱砂底纹签 + 松烟绿微圆点」标记重点。
    - 2026-11-23: 移除秒表与计时器，拍平底部三栏；背景底层采用盲文子像素余弦相位曲线 + 狄拉克脉冲与模同余数学图谱；
      单次闹钟支持选择具体日期，按真实日期时间戳计算下一次响铃顺位与倒计时。
  -->
  <link rel="stylesheet" href="../../packages/design-system/terminal.css">
</head>

    const brailleLeft = [0x01, 0x02, 0x04, 0x40];
    const brailleRight = [0x08, 0x10, 0x20, 0x80];

    function localDateIso(offsetDays = 0) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function defaultOnceDate(hhmm) {
      const now = new Date();
      const [h, m] = hhmm.split(':').map(Number);
      const passed = h * 60 + m <= now.getHours() * 60 + now.getMinutes();
      return localDateIso(passed ? 1 : 0);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    function toast(message) {
      const el = document.querySelector('#toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 1800);
    }

    function switchHtml(id, enabled, label, attr = 'data-switch') {
      return `<button class="dip-switch" type="button" aria-label="${escapeHtml(label)}" aria-pressed="${enabled}" ${attr}="${id}"><i></i>${enabled ? 'ON' : 'OFF'}</button>`;
    }

    function nextTriggerDate(item) {
      const now = new Date();
      const [h, m] = item.time.split(':').map(Number);
      if (item.repeat === '仅一次' && item.date) {
        const [yy, mm, dd] = item.date.split('-').map(Number);
        const target = new Date(yy, mm - 1, dd, h, m, 0, 0);
        if (target.getTime() > now.getTime()) {
          return target;
        }
      }
      const candidate = new Date(now);
      candidate.setHours(h, m, 0, 0);
      if (candidate.getTime() <= now.getTime()) {
        candidate.setDate(candidate.getDate() + 1);
      }
      if (item.repeat === '工作日') {
        while (candidate.getDay() === 0 || candidate.getDay() === 6) {
          candidate.setDate(candidate.getDate() + 1);
        }
      }
      return candidate;
    }

    function deltaMinutesForAlarm(item) {
      return Math.max(1, Math.round((nextTriggerDate(item).getTime() - Date.now()) / 60000));
    }

    function formatDelta(diffMins) {
      if (diffMins >= 1440) {
        const days = Math.floor(diffMins / 1440);
        const hours = Math.floor((diffMins % 1440) / 60);
        return `${days}d ${String(hours).padStart(2, '0')}h`;
      }
      return `${Math.floor(diffMins / 60)}h ${String(diffMins % 60).padStart(2, '0')}m`;
    }

    function formatAlarmScheduleLabel(item) {
      if (item.repeat !== '仅一次' || !item.date) {
        return item.repeat;
      }
      const today = localDateIso(0);
      const tomorrow = localDateIso(1);
      if (item.date === today) {
        return '今天';
      }
      if (item.date === tomorrow) {
        return `明天 ${item.date.slice(5)}`;
      }
      const [yy, mm, dd] = item.date.split('-').map(Number);
      const wk = weekNames[new Date(yy, mm - 1, dd).getDay()];
      return `${item.date.slice(5)} ${wk}`;
    }

    function activeSortedAlarms() {
      return [...alarms]
        .filter((item) => item.enabled && !item.skippedOnce)
        .sort((a, b) => nextTriggerDate(a).getTime() - nextTriggerDate(b).getTime());
    }

    function renderTtyBar() {
      const pathEl = document.querySelector('#tty-path');
      const statEl = document.querySelector('#tty-stat');
      const slug = pageMeta[current][1].slice(1);
      pathEl.innerHTML = `<b>$</b>pocket/${slug}`;
      if (current === 'crontab') {
        const activeCount = agents.filter((a) => a.active).length;
        statEl.innerHTML = `<i class="dot ok"></i>${activeCount} agents bound`;
        return;
      }
      statEl.innerHTML = cloudOnline
        ? `<i class="dot ok"></i>online · outbox ${outboxCount}`
        : `<i class="dot off"></i>offline · outbox ${outboxCount}`;
    }

    /* 使用 Unicode 盲文 2x4 微点阵绘制平滑连续余弦波 φ(t) = -cos(2πt/1440) 与狄拉克采样脉冲 */
    function buildBrailleWave(charCols, charRows, activeAlarms, nowMinutes) {
      const subW = charCols * 2;
      const subH = charRows * 4;
      const midY = Math.floor(subH / 2);
      const grid = Array.from({ length: charRows }, () => Array(charCols).fill(0));
      const overlay = new Map();

      const setDot = (sx, sy) => {
        if (sx < 0 || sx >= subW || sy < 0 || sy >= subH) {
          return;
        }
        const cx = Math.floor(sx / 2);
        const cy = Math.floor(sy / 4);
        const bit = sx % 2 === 0 ? brailleLeft[sy % 4] : brailleRight[sy % 4];
        grid[cy][cx] |= bit;
      };

      for (let sx = 0; sx < subW; sx += 3) {
        setDot(sx, midY);
      }

      const samples = subW * 4;
      for (let i = 0; i <= samples; i += 1) {
        const sx = Math.min(subW - 1, Math.floor(i / 4));
        const theta = (i / samples) * Math.PI * 2;
        const norm = (1 + Math.cos(theta)) / 2;
        const sy = Math.round(1 + norm * (subH - 3));
        setDot(sx, sy);
      }

      activeAlarms.forEach((item, idx) => {
        const [h, m] = item.time.split(':').map(Number);
        const mins = h * 60 + m;
        const sx = Math.min(subW - 1, Math.round((mins / 1440) * (subW - 1)));
        const theta = (mins / 1440) * Math.PI * 2;
        const sy = Math.round(1 + ((1 + Math.cos(theta)) / 2) * (subH - 3));
        const top = Math.min(sy, midY);
        const bot = Math.max(sy, midY);
        for (let y = top; y <= bot; y += 1) {
          setDot(sx, y);
        }
        const key = `${Math.floor(sy / 4)}:${Math.floor(sx / 2)}`;
        if (!overlay.has(key)) {
          overlay.set(key, idx === 0 ? '<span class="mark">◆</span>' : '<span class="hi">●</span>');
        }
      });

      const nowSx = Math.min(subW - 1, Math.round((nowMinutes / 1440) * (subW - 1)));
      const nowTheta = (nowMinutes / 1440) * Math.PI * 2;
      const nowSy = Math.round(1 + ((1 + Math.cos(nowTheta)) / 2) * (subH - 3));
      const nowKey = `${Math.floor(nowSy / 4)}:${Math.floor(nowSx / 2)}`;
      if (!overlay.has(nowKey)) {
        overlay.set(nowKey, '<span class="hi">▲</span>');
      }

      return grid.map((row, r) => row.map((mask, c) => {
        const k = `${r}:${c}`;
        if (overlay.has(k)) {
          return overlay.get(k);
        }
        return mask === 0 ? ' ' : String.fromCodePoint(0x2800 + mask);
      }).join(''));
    }

    function renderAsciiUnderlay() {
      const canvas = document.querySelector('#ascii-canvas');
      if (!canvas) {
        return;
      }
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const nowStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const active = activeSortedAlarms();
      const waveLines = buildBrailleWave(48, 5, active, nowMinutes);

      const setExpr = active.length
        ? active.slice(0, 3).map((a) => a.time).join(', ')
        : '∅';
      const eq1 = current === 'crontab'
        ? `S = { t ∈ ℕ │ cron(t)=1 }   ttl = 900s   t_now = ${nowStr}`
        : current === 'world'
          ? `θ(z) ≡ t₀ + Δz (mod 24)   ω = 15°/h   t_loc = ${nowStr}`
          : `t ∈ ℤ/1440ℤ   φ(t) = −cos(2πt/24h)   ▲ now = ${nowStr}`;
      const eq2 = current === 'crontab'
        ? 'POST ↦ 202 Accepted   H(k_cb) ≠ H(k_ep)   idempotent'
        : `f(t) = Σ δ(t − tₖ),  k ∈ { ${setExpr} }`;

      const totalRows = 38;
      const lines = [];
      for (let r = 1; r <= totalRows; r += 1) {
        const axis = r % 6 === 0 ? `τ${r / 6}` : String(r).padStart(2, '0');
        if (r <= 28) {
          lines.push(`${axis}│`);
        } else if (r === 29) {
          lines.push(`${axis}│   ∶       +       ·       ≡       ·       +       ∶`);
        } else if (r === 30) {
          lines.push(`${axis}│  <span class="hi">${eq1}</span>`);
        } else if (r >= 31 && r <= 35) {
          const wIdx = r - 31;
          const prefix = wIdx === 0 ? '+1' : wIdx === 2 ? ' 0' : wIdx === 4 ? '−1' : '  ';
          lines.push(`${axis}│${prefix} ${waveLines[wIdx]}`);
        } else if (r === 36) {
          lines.push(`${axis}│   00h         06h         12h         18h        24h`);
        } else if (r === 37) {
          lines.push(`${axis}│  <span class="hi">${eq2}</span>`);
        } else {
          lines.push(`${axis}│   ·       ∶       ∆       ·       ∈       ∶       ·`);
        }
      }
      canvas.innerHTML = lines.join('\n');
    }

    function alarmsPage() {
      const next = activeSortedAlarms()[0] || null;
      const others = [...alarms]
        .filter((item) => item.id !== next?.id)
        .sort((a, b) => a.time.localeCompare(b.time));

      const skipBtn = next && next.repeat !== '仅一次'
        ? `<button class="cmd-quiet outlined mini" type="button" data-skip="${next.id}">跳过本次</button>`
        : '';

      const hero = next
        ? `<article class="hero">
            <div class="hero-top">
              <span class="t-minus"><i class="dot mark"></i><b>${formatDelta(deltaMinutesForAlarm(next))}</b> 后响铃</span>
              ${next.locked ? '<span class="mark-tag lock">LOCKED · 本机锁</span>' : '<span class="mark-tag neutral">云端可同步</span>'}
            </div>
            <div class="hero-mid">
              <button class="hero-main-btn" type="button" data-edit="${next.id}">
                <span class="hero-time">${escapeHtml(next.time)}</span>
              </button>
              <div class="hero-controls">
                ${skipBtn}
                ${switchHtml(next.id, next.enabled, `切换${next.title}`)}
              </div>
            </div>
            <div class="hero-foot">
              <div class="hero-name">${escapeHtml(next.title)} <span>${escapeHtml(formatAlarmScheduleLabel(next))} · ${escapeHtml(next.delivery)}</span></div>
              <span class="receipt-code"><i class="dot ${next.state === 'EXECUTED' ? 'ok' : 'mark'}"></i>${escapeHtml(next.state)} · ${escapeHtml(next.target)}</span>
            </div>
          </article>`
        : `<div class="empty">当前没有即将响铃的闹钟<br><button class="cmd-quiet outlined" type="button" data-open="alarm">+ 新建闹钟</button></div>`;

      const rows = others.map((item) => {
        const badges = [];
        if (item.locked) {
          badges.push('<span class="mark-tag lock">本机锁</span>');
        }
        if (item.linkedEvent) {
          badges.push('<span class="mark-tag neutral">日历关联</span>');
        }
        if (item.skippedOnce) {
          badges.push('<span class="mark-tag neutral">本次已跳过</span>');
        }
        const schedText = formatAlarmScheduleLabel(item);
        const stateText = !item.enabled ? 'paused' : item.skippedOnce ? 'skip-next' : item.state;
        const rightAction = item.skippedOnce
          ? `<button class="cmd-quiet outlined mini" type="button" data-unskip="${item.id}">恢复本次</button>`
          : switchHtml(item.id, item.enabled, `切换${item.title}`);

        return `<article class="row ${item.enabled ? '' : 'disabled'}">
          <button class="row-btn" type="button" data-edit="${item.id}">
            <span class="row-time">${escapeHtml(item.time)}</span>
            <span>
              <span class="row-title">${escapeHtml(item.title)} ${badges.join(' ')}</span>
              <span class="row-meta">${escapeHtml(schedText)} · ${escapeHtml(item.target)} · ${escapeHtml(stateText)}</span>
            </span>
          </button>
          ${rightAction}
        </article>`;
      }).join('');

      return `<div class="foreground-stack">
        ${hero}
        <div class="col-head"><span>OTHER ALARMS (${others.length})</span><span>STATE / ACTION</span></div>
        <div class="rows">${rows}</div>
      </div>`;
    }

    function crontabPage() {
      const cards = plans.map((plan) => {
        const badge = !plan.enabled && plan.statusKind !== 'expired'
          ? '<span class="mark-tag neutral">PAUSED</span>'
          : plan.statusKind === 'ok'
            ? `<span class="receipt-code"><i class="dot ok"></i>${escapeHtml(plan.status)}</span>`
            : plan.statusKind === 'wait'
              ? `<span class="mark-tag lock">${escapeHtml(plan.status)}</span>`
              : `<span>${escapeHtml(plan.status)}</span>`;
        const out = plan.receipt
          ? `<div class="jc-out"><span>↳ ${escapeHtml(plan.receipt)}</span><code>${escapeHtml(plan.receiptTime)}</code></div>`
          : '';
        return `<article class="job-card interactive ${plan.statusKind === 'expired' || !plan.enabled ? 'expired' : ''}" data-edit-plan="${plan.id}">
          <div class="jc-head">
            <span class="jc-target">post → <b>${escapeHtml(plan.agentId)}</b></span>
            ${badge}
          </div>
          <p class="jc-prompt">${escapeHtml(plan.prompt)}</p>
          <div class="jc-spec">${escapeHtml(plan.spec)}</div>
          ${out}
        </article>`;
      }).join('');

      return `<div class="foreground-stack">
        <p class="man-line">云端按计划向指定 Agent 发送请求，手机关机照常触发；点击卡片可编辑、暂停或删除。</p>
        <div class="jobs">${cards}</div>
      </div>`;
    }

    function zoneOffsetHours(zone, date) {
      const text = new Intl.DateTimeFormat('en-US', {
        timeZone: zone,
        timeZoneName: 'shortOffset'
      }).formatToParts(date).find((p) => p.type === 'timeZoneName')?.value || 'GMT+0';
      const match = /GMT([+-]\d+)(?::(\d+))?/.exec(text);
      if (!match) {
        return 0;
      }
      const hours = Number(match[1]);
      const mins = Number(match[2] || 0);
      return hours + (hours < 0 ? -mins / 60 : mins / 60);
    }

    function worldPage() {
      const now = new Date();
      const homeOffset = zoneOffsetHours('Asia/Shanghai', now);
      const homeDay = Number(
        new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Shanghai',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(now).replaceAll('-', '')
      );
      const list = cities.map(([name, zone], index) => {
        const time = new Intl.DateTimeFormat('zh-CN', {
          timeZone: zone,
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).format(now);
        const localDay = Number(
          new Intl.DateTimeFormat('en-CA', {
            timeZone: zone,
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }).format(now).replaceAll('-', '')
        );
        const day = localDay === homeDay ? '今天' : localDay > homeDay ? '明天' : '昨天';
        const utcOff = zoneOffsetHours(zone, now);
        const diff = utcOff - homeOffset;
        const utcLabel = `UTC${utcOff >= 0 ? '+' : '−'}${Math.abs(utcOff)}`;
        const diffLabel = diff === 0 ? 'Δ 0h' : `Δ ${diff > 0 ? '+' : '−'}${Math.abs(diff)}h`;
        const removeBtn = cities.length > 1
          ? `<button class="cmd-quiet mini" type="button" aria-label="移除${escapeHtml(name)}" data-remove-city="${index}">×</button>`
          : '';
        return `<article class="row">
          <div class="row-btn">
            <span class="row-time">${time}</span>
            <span>
              <span class="row-title">${escapeHtml(name)} <span class="mark-tag neutral">${utcLabel}</span></span>
              <span class="row-meta">${escapeHtml(zone)} · ${day}</span>
            </span>
          </div>
          <div class="city-right">
            <span class="receipt-code">${diffLabel}</span>
            ${removeBtn}
          </div>
        </article>`;
      }).join('');
      return `<div class="foreground-stack">
        <div class="col-head"><span>LOCAL TIME (${cities.length})</span><span>OFFSET</span></div>
        <div class="rows">${list}</div>
      </div>`;
    }

    function render(page = current, animate = false) {
      current = page;
      if (page !== 'settings') {
        lastMainPage = page;
      }
      const [title, sub, cta] = pageMeta[page];
      document.querySelector('#page-title').textContent = title;
      document.querySelector('#page-sub').textContent = sub;
      renderTtyBar();
      renderAsciiUnderlay();

      content.innerHTML = ({
        alarm: alarmsPage,
        crontab: crontabPage,
        world: worldPage,
        settings: settingsPage
      })[page]();

      if (animate) {
        content.classList.remove('view-enter');
        void content.offsetWidth;
        content.classList.add('view-enter');
      }

      bottomNav.innerHTML = navItems.map(([id, label, key]) => (
        `<button class="nav-item" type="button" data-page="${id}" ${page === id ? 'aria-current="page"' : ''}><kbd>[${key}]</kbd><span>${label}</span></button>`
      )).join('');

      document.querySelector('#settings-button').hidden = page === 'settings';
      backButton.hidden = page !== 'settings';
      createButton.hidden = !cta;
      if (cta) {
        createButton.textContent = cta;
      }
      content.scrollTop = 0;
    }

    function navigate(page, push = true) {
      if (push) {
        history.pushState({ page }, '', `?page=${page}`);
      }
      render(page, true);
    }

    function syncAlarmDateField() {
      const dateWrap = form.querySelector('[data-once-date]');
      if (!dateWrap) {
        return;
      }
      const repeatVal = form.querySelector('input[name="repeat"]:checked')?.value || '仅一次';
      dateWrap.hidden = repeatVal !== '仅一次';
    }

    function updatePlanPreview() {
      const box = form.querySelector('#cli-preview');
      if (!box) {
        return;
      }
      const mode = form.dataset.planMode || 'cron';
      const scheduleRow = form.querySelector('[data-cron-only]');
      if (scheduleRow) {
        scheduleRow.hidden = mode !== 'cron';
      }
      try {
        const plan = PocketAgent.createAgentPlan({
          agentId: form.querySelector('#plan-agent')?.value || '@work-agent',
          prompt: form.querySelector('#plan-prompt')?.value || 'Prompt',
          mode,
          schedule: form.querySelector('input[name="schedule"]:checked')?.value || '每天',
          time: form.querySelector('#plan-time')?.value || '16:00',
          ttlMinutes: Number(form.querySelector('input[name="ttl"]:checked')?.value || 15),
          missedPolicy: form.querySelector('input[name="missed"]:checked')?.value || 'skip'
        });
        box.innerHTML = `<b>$</b> ${escapeHtml(PocketAgent.formatPlanCommand(plan))}`;
      } catch (err) {
        box.textContent = `$ invalid: ${err.message}`;
      }
    }

    function openDialog(kind, editId = null) {
      editingAlarm = kind === 'alarm' ? editId : null;
      editingPlan = kind === 'plan' ? editId : null;
      form.dataset.kind = kind;
      if (kind === 'alarm') {
        const existing = editingAlarm ? alarms.find((a) => a.id === editingAlarm) : null;
        document.querySelector('#dialog-title').textContent = existing ? '编辑闹钟' : '新建闹钟';
        const time = existing ? existing.time : '07:30';
        const title = existing ? existing.title : '闹钟';
        const repeat = existing ? existing.repeat : '仅一次';
        const dateVal = existing?.date || defaultOnceDate(time);
        const minDate = localDateIso(0);
        const delivery = existing ? existing.delivery : '响铃';
        const locked = existing ? existing.locked : false;
        form.innerHTML = `
          <div class="field"><label for="alarm-time">TIME</label><input class="time-input" id="alarm-time" name="time" type="time" value="${escapeHtml(time)}" required></div>
          <fieldset><legend>REPEAT</legend><div class="choices">${['仅一次', '每天', '工作日'].map((r) => `<label class="choice"><input type="radio" name="repeat" value="${r}" ${r === repeat ? 'checked' : ''}><span>${r}</span></label>`).join('')}</div></fieldset>
          <div class="field" data-once-date>
            <label for="alarm-date">DATE · 指定响铃日期</label>
            <div class="date-row">
              <input class="date-input" id="alarm-date" name="date" type="date" min="${minDate}" value="${escapeHtml(dateVal)}">
              <div class="date-shortcuts">
                <button class="cmd-quiet outlined mini" type="button" data-date-offset="0">今天</button>
                <button class="cmd-quiet outlined mini" type="button" data-date-offset="1">明天</button>
                <button class="cmd-quiet outlined mini" type="button" data-date-offset="2">后天</button>
              </div>
            </div>
          </div>
          <div class="field"><label for="alarm-title">TITLE</label><input id="alarm-title" name="title" value="${escapeHtml(title)}" required></div>
          <fieldset><legend>DELIVERY</legend><div class="choices">${['响铃', '仅通知'].map((d) => `<label class="choice"><input type="radio" name="delivery" value="${d}" ${d === delivery ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div></fieldset>
          <label class="check-line" for="alarm-lock"><span>LOCKED · 本机锁（禁止云端或 Agent 修改）</span><input id="alarm-lock" name="locked" type="checkbox" ${locked ? 'checked' : ''}></label>
          <button class="btn-block primary" type="submit">保存闹钟</button>
          ${existing ? '<button class="btn-block" type="button" id="delete-alarm">删除闹钟</button>' : ''}`;
        syncAlarmDateField();
      } else if (kind === 'crontab' || kind === 'plan') {
        form.dataset.kind = 'plan';
        const existing = editingPlan ? plans.find((p) => p.id === editingPlan) : null;
        document.querySelector('#dialog-title').textContent = existing ? '编辑 Agent 计划' : '新建 Agent 计划';
        const mode = existing ? existing.mode : 'cron';
        const time = existing ? existing.time : '16:00';
        const prompt = existing ? existing.prompt : '整理本周笔记草稿，生成周五复盘清单';
        const sched = existing ? existing.schedule : '每周五';
        const ttl = existing ? existing.ttlMinutes : 15;
        const missed = existing ? existing.missedPolicy : 'skip';
        form.dataset.planMode = mode;
        const activeAgents = agents.filter((a) => a.active);
        const pool = activeAgents.length ? activeAgents : agents;
        const options = pool.map((a) => `<option value="${escapeHtml(a.id)}" ${existing?.agentId === a.id ? 'selected' : ''}>${escapeHtml(a.name)} (${escapeHtml(a.id)})</option>`).join('');
        form.innerHTML = `
          <div class="field"><label for="plan-agent">TARGET AGENT</label><select id="plan-agent" name="agentId">${options}</select></div>
          <div class="field"><label for="plan-prompt">PROMPT</label><textarea class="prompt-input" id="plan-prompt" name="prompt" required>${escapeHtml(prompt)}</textarea></div>
          <div class="field"><label>TRIGGER MODE</label><div class="seg-bar"><button type="button" data-plan-mode="once" aria-pressed="${mode === 'once'}">单次时间</button><button type="button" data-plan-mode="cron" aria-pressed="${mode === 'cron'}">周期 Cron</button></div></div>
          <div class="field"><label for="plan-time">LOCAL TIME · Asia/Shanghai</label><input class="time-input" id="plan-time" name="time" type="time" value="${escapeHtml(time)}" required></div>
          <fieldset data-cron-only><legend>SCHEDULE</legend><div class="choices">${['每天', '工作日', '每周五'].map((s) => `<label class="choice"><input type="radio" name="schedule" value="${s}" ${s === sched ? 'checked' : ''}><span>${s}</span></label>`).join('')}</div></fieldset>
          <fieldset><legend>WINDOW &amp; MISSED POLICY</legend><div class="choices">
            <label class="choice"><input type="radio" name="ttl" value="15" ${ttl === 15 ? 'checked' : ''}><span>ttl=15m</span></label>
            <label class="choice"><input type="radio" name="ttl" value="60" ${ttl === 60 ? 'checked' : ''}><span>ttl=60m</span></label>
            <label class="choice"><input type="radio" name="missed" value="skip" ${missed === 'skip' ? 'checked' : ''}><span>missed=skip</span></label>
            <label class="choice"><input type="radio" name="missed" value="latest" ${missed === 'latest' ? 'checked' : ''}><span>missed=latest</span></label>
          </div></fieldset>
          <div class="cli-preview" id="cli-preview" aria-live="polite"></div>
          <button class="btn-block primary" type="submit">保存计划</button>
          ${existing ? `<div class="dialog-split"><button class="btn-block" type="button" id="toggle-plan">${existing.enabled ? '暂停计划' : '恢复计划'}</button><button class="btn-block" type="button" id="delete-plan">删除计划</button></div>` : ''}`;
        updatePlanPreview();
      } else if (kind === 'binding') {
        document.querySelector('#dialog-title').textContent = '新增 Agent 绑定';
        form.innerHTML = `
          <div class="field"><label for="bind-id">HANDLE</label><input id="bind-id" name="id" placeholder="@research-bot" required></div>
          <div class="field"><label for="bind-name">NAME</label><input id="bind-name" name="name" placeholder="资料整理 Agent" required></div>
          <div class="field"><label for="bind-ep">HTTPS ENDPOINT</label><input id="bind-ep" name="endpoint" type="url" value="https://" required></div>
          <div class="field"><label for="bind-secret">CREDENTIAL (加密保存，列表不回显)</label><input id="bind-secret" name="secret" type="password" placeholder="输入调用密钥" required></div>
          <button class="btn-block primary" type="submit">保存绑定</button>`;
      } else if (kind === 'world') {
        document.querySelector('#dialog-title').textContent = '添加城市';
        form.innerHTML = `
          <div class="field"><label for="city">CITY</label><select id="city" name="city">
            <option value="东京|Asia/Tokyo">东京 (Asia/Tokyo)</option>
            <option value="新加坡|Asia/Singapore">新加坡 (Asia/Singapore)</option>
            <option value="巴黎|Europe/Paris">巴黎 (Europe/Paris)</option>
            <option value="洛杉矶|America/Los_Angeles">洛杉矶 (America/Los_Angeles)</option>
          </select></div>
          <button class="btn-block primary" type="submit">添加城市</button>`;
      }
      dialog.showModal();
      form.querySelector('input, select, textarea')?.focus();
    }

    bottomNav.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-page]');
      if (btn) {
        navigate(btn.dataset.page);
      }
    });

    document.querySelector('#settings-button').addEventListener('click', () => navigate('settings'));
    backButton.addEventListener('click', () => navigate(lastMainPage));
    document.querySelector('#theme-toggle').addEventListener('click', () => {
      document.body.dataset.theme = document.body.dataset.theme === 'black' ? 'white' : 'black';
    });
    createButton.addEventListener('click', () => openDialog(current));
    document.querySelector('#dialog-close').addEventListener('click', () => dialog.close());

    content.addEventListener('click', (event) => {
      const sw = event.target.closest('[data-switch]');
      const skipBtn = event.target.closest('[data-skip]');
      const unskipBtn = event.target.closest('[data-unskip]');
      const edit = event.target.closest('[data-edit]');
      const editPlan = event.target.closest('[data-edit-plan]');
      const removeCity = event.target.closest('[data-remove-city]');
      const openBtn = event.target.closest('[data-open]');
      const cloudBtn = event.target.closest('[data-toggle-cloud]');
      const agentToggle = event.target.closest('[data-toggle-agent]');
      const toastBtn = event.target.closest('[data-toast]');

      if (sw) {
        const item = alarms.find((a) => a.id === Number(sw.dataset.switch));
        if (item) {
          item.enabled = !item.enabled;
          item.skippedOnce = false;
          if (!cloudOnline) {
            outboxCount += 1;
            item.state = 'OFFLINE_QUEUED';
          } else {
            item.state = 'EXECUTED';
          }
        }
        render();
      } else if (skipBtn) {
        const item = alarms.find((a) => a.id === Number(skipBtn.dataset.skip));
        if (item) {
          item.skippedOnce = true;
          render();
          toast(`已跳过本次 ${item.time}，下次照常响铃`);
        }
      } else if (unskipBtn) {
        const item = alarms.find((a) => a.id === Number(unskipBtn.dataset.unskip));
        if (item) {
          item.skippedOnce = false;
          render();
          toast(`已恢复 ${item.time}`);
        }
      } else if (edit) {
        openDialog('alarm', Number(edit.dataset.edit));
      } else if (editPlan) {
        openDialog('plan', Number(editPlan.dataset.editPlan));
      } else if (removeCity) {
        const idx = Number(removeCity.dataset.removeCity);
        const removed = cities.splice(idx, 1)[0];
        render('world');
        if (removed) {
          toast(`已移除 ${removed[0]}`);
        }
      } else if (openBtn) {
        openDialog(openBtn.dataset.open);
      } else if (cloudBtn) {
        cloudOnline = !cloudOnline;
        if (cloudOnline && outboxCount > 0) {
          outboxCount = 0;
          alarms.forEach((a) => {
            if (a.state === 'OFFLINE_QUEUED') {
              a.state = 'EXECUTED';
            }
          });
          toast('已重连 Cloud 并同步离线队列');
        }
        render();
      } else if (agentToggle) {
        const ag = agents.find((a) => a.id === agentToggle.dataset.toggleAgent);
        if (ag) {
          ag.active = !ag.active;
          render();
        }
      } else if (toastBtn) {
        toast(toastBtn.dataset.toast);
      }
    });

    form.addEventListener('input', () => {
      updatePlanPreview();
      syncAlarmDateField();
    });
    form.addEventListener('change', () => {
      updatePlanPreview();
      syncAlarmDateField();
    });
    form.addEventListener('click', (event) => {
      const dateQuick = event.target.closest('[data-date-offset]');
      if (dateQuick) {
        const dateInput = form.querySelector('#alarm-date');
        if (dateInput) {
          dateInput.value = localDateIso(Number(dateQuick.dataset.dateOffset));
        }
        return;
      }
      const modeBtn = event.target.closest('[data-plan-mode]');
      if (modeBtn) {
        form.dataset.planMode = modeBtn.dataset.planMode;
        form.querySelectorAll('[data-plan-mode]').forEach((b) => {
          b.setAttribute('aria-pressed', String(b === modeBtn));
        });
        updatePlanPreview();
        return;
      }
      if (event.target.closest('#delete-alarm')) {
        alarms = alarms.filter((a) => a.id !== editingAlarm);
        dialog.close();
        render('alarm');
        toast('闹钟已删除');
        return;
      }
      if (event.target.closest('#toggle-plan')) {
        const item = plans.find((p) => p.id === editingPlan);
        if (item) {
          item.enabled = !item.enabled;
          if (item.enabled && item.statusKind === 'expired') {
            item.statusKind = 'wait';
            item.status = item.mode === 'once' ? `${item.time} 单次` : 'SCHEDULED';
          }
          dialog.close();
          render('crontab');
          toast(item.enabled ? '计划已恢复' : '计划已暂停');
        }
        return;
      }
      if (event.target.closest('#delete-plan')) {
        plans = plans.filter((p) => p.id !== editingPlan);
        dialog.close();
        render('crontab');
        toast('计划已删除');
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const kind = form.dataset.kind;

      if (kind === 'alarm') {
        const repeat = data.get('repeat');
        const time = data.get('time');
        let chosenDate = repeat === '仅一次' ? String(data.get('date') || '') : '';
        if (repeat === '仅一次') {
          if (!chosenDate) {
            chosenDate = defaultOnceDate(time);
          } else {
            const [yy, mm, dd] = chosenDate.split('-').map(Number);
            const [hh, min] = time.split(':').map(Number);
            if (new Date(yy, mm - 1, dd, hh, min).getTime() <= Date.now()) {
              chosenDate = localDateIso(1);
            }
          }
        }
        const locked = data.get('locked') === 'on';
        const state = cloudOnline ? 'EXECUTED' : 'OFFLINE_QUEUED';
        if (!cloudOnline) {
          outboxCount += 1;
        }
        const payload = {
          time,
          date: chosenDate,
          title: String(data.get('title') || '闹钟').trim(),
          repeat,
          delivery: data.get('delivery'),
          locked,
          skippedOnce: false,
          target: locked ? 'local-only' : 'phone',
          state
        };
        if (editingAlarm) {
          const item = alarms.find((a) => a.id === editingAlarm);
          if (item) {
            Object.assign(item, payload);
          }
        } else {
          alarms.push({ id: Date.now(), enabled: true, linkedEvent: false, ...payload });
        }
        dialog.close();
        render('alarm');
        toast(editingAlarm ? '闹钟修改已保存' : '闹钟已设置');
      } else if (kind === 'plan') {
        const mode = form.dataset.planMode || 'cron';
        const scheduleKind = data.get('schedule') || '每天';
        const ttlMinutes = Number(data.get('ttl') || 15);
        const missedPolicy = data.get('missed') || 'skip';
        const plan = PocketAgent.createAgentPlan({
          agentId: data.get('agentId'),
          prompt: data.get('prompt'),
          mode,
          schedule: scheduleKind,
          time: data.get('time'),
          ttlMinutes,
          missedPolicy
        });
        const spec = plan.mode === 'once'
          ? `at ${plan.runAt} · ttl=${plan.ttlMinutes}m · 附一次性回调密钥`
          : `${plan.cron} · ${plan.schedule.kind} ${plan.schedule.time} · ttl=${plan.ttlMinutes}m · missed=${plan.missedPolicy}`;
        const nextFields = {
          agentId: plan.agentId,
          prompt: plan.prompt,
          mode: plan.mode,
          schedule: scheduleKind,
          time: data.get('time'),
          ttlMinutes,
          missedPolicy,
          spec,
          enabled: true,
          status: plan.mode === 'once' ? `${plan.runAt} 单次` : 'SCHEDULED',
          statusKind: 'wait',
          receipt: '尚未到点，等待云端触发',
          receiptTime: 'SCHEDULED'
        };
        if (editingPlan) {
          const existing = plans.find((p) => p.id === editingPlan);
          if (existing) {
            Object.assign(existing, nextFields);
          }
        } else {
          plans.unshift({ id: Date.now(), ...nextFields });
        }
        dialog.close();
        render('crontab');
        toast(editingPlan ? 'Agent 计划已更新' : 'Agent 计划已保存');
      } else if (kind === 'binding') {
        const rawId = String(data.get('id') || '').trim();
        const id = rawId.startsWith('@') ? rawId : `@${rawId}`;
        agents.push({
          id,
          name: String(data.get('name') || '').trim(),
          endpoint: String(data.get('endpoint') || '').trim(),
          active: true
        });
        dialog.close();
        render('settings');
        toast(`已加密保存 ${id}`);
      } else if (kind === 'world') {
        const [name, zone] = String(data.get('city')).split('|');
        if (!cities.some(([c]) => c === name)) {
          cities.push([name, zone]);
        }
        dialog.close();
        render('world');
        toast(`已添加 ${name}`);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.target.closest('input, select, textarea, [contenteditable]') || dialog.open) {
        return;
      }
      const key = event.key.toLowerCase();
      const targetPage = { a: 'alarm', p: 'crontab', w: 'world' }[key];
      if (targetPage) {
        event.preventDefault();
        navigate(targetPage);
      } else if (key === 'n' && !createButton.hidden) {
        event.preventDefault();
        createButton.click();
      } else if (key === 'c') {
        event.preventDefault();
        navigate('settings');
      } else if (key === 'b') {
        event.preventDefault();
        document.querySelector('#theme-toggle').click();
      }
    });

    window.addEventListener('popstate', (event) => {
      render(event.state?.page || 'alarm');
    });

    setInterval(() => {
      if (Date.now() % 60000 < 1100) {
        render(current);
      }
    }, 1000);

    const params = new URLSearchParams(location.search);
    document.body.dataset.theme = params.get('theme') === 'black' ? 'black' : 'white';
    if (params.get('motion') === 'off') {
      document.body.dataset.motion = 'off';
    }
    const initial = pageMeta[params.get('page')] ? params.get('page') : 'alarm';
    history.replaceState({ page: initial }, '', `?page=${initial}`);
    render(initial);
    if (params.get('create')) {
      openDialog(params.get('create'));
    }
  </script>
</body>
</html>
