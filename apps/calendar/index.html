<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Calendar</title>
  <!--
    Pocket Calendar (日程与时间合一应用，见 docs/design-standard.md & docs/cloud/calendar.md):
    - 底部单层三栏：
      [d] 今日日程：仅展示今天当天日程（下一场主角卡 + 今日其余场次 + 重叠检测）
      [m] 月历：7 列等宽月历矩阵 + 选中日期日程查看
      [t] Todo：用统一「@指派对象」（仅待办 / @me 手机响铃 / @Agent 自动执行）合一配置闹钟与 Agent 计划；
          单次事项使用完成复选框（支持指定日期），周期循环项使用启停拨码开关（支持跳过下一次与本机锁）
  -->
  <link rel="stylesheet" href="../../packages/design-system/terminal.css">
</head>
<body data-theme="white">
  <main class="phone" aria-label="Pocket 日程与时间原型">
    <div class="ascii-underlay" aria-hidden="true">
      <pre class="ascii-canvas" id="ascii-canvas"></pre>
    </div>

    <div class="tty-bar">
      <span class="tty-path" id="tty-path"><b>$</b>pocket/today</span>
      <span class="tty-stat" id="tty-stat"></span>
    </div>

    <header class="topbar">
      <div class="title-group">
        <button class="cmd-quiet outlined" id="back-button" type="button" aria-label="返回" hidden>← back</button>
        <h1 id="page-title" tabindex="-1">今日日程</h1>
        <span class="header-sub" id="page-sub">/today</span>
      </div>
      <div class="top-actions">
        <button class="cmd-quiet" id="theme-toggle" type="button" aria-label="切换深浅纸面">b/w</button>
        <button class="cmd-quiet outlined" id="settings-button" type="button">cfg</button>
        <button class="cmd-primary" id="create-button" type="button">+ event</button>
      </div>
    </header>

    <section class="content" id="content"></section>
    <nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <dialog id="form-dialog" closedby="any" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title">新建</h2>
      <button class="cmd-quiet" id="dialog-close" type="button" aria-label="关闭">[esc]</button>
    </div>
    <form class="dialog-body" id="active-form" method="dialog" aria-labelledby="dialog-title"></form>
  </dialog>

  <script src="../../packages/agent-core/src/cron.js"></script>
  <script>
    const pageMeta = {
      agenda: ['今日日程', '/today', '+ event'],
      month: ['月历', '/month', '+ event'],
      todo: ['Todo', '/todo', '+ todo'],
      settings: ['配置', '/config', '']
    };
    const navItems = [
      ['agenda', '今日日程', 'd'],
      ['month', '月历', 'm'],
      ['todo', 'Todo', 't']
    ];
    const recurringSet = new Set(['每天', '工作日', '每周五']);
    const weekShort = ['一', '二', '三', '四', '五', '六', '日'];
    const brailleLeft = [0x01, 0x02, 0x04, 0x40];
    const brailleRight = [0x08, 0x10, 0x20, 0x80];

    const content = document.querySelector('#content');
    const bottomNav = document.querySelector('#bottom-nav');
    const dialog = document.querySelector('#form-dialog');
    const form = document.querySelector('#active-form');
    const createButton = document.querySelector('#create-button');
    const backButton = document.querySelector('#back-button');

    function localDateIso(offsetDays = 0) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    let current = 'agenda';
    let lastMainPage = 'agenda';
    let selectedDate = localDateIso(0);
    let viewYear = Number(selectedDate.slice(0, 4));
    let viewMonth = Number(selectedDate.slice(5, 7)) - 1;
    let editingEvent = null;
    let editingTodo = null;
    let quickTarget = '@me';
    let quickTime = '07:30';
    let quickSchedule = '工作日';
    let quickDate = localDateIso(1);
    let quickText = '';
    let cloudOnline = true;
    let toastTimer;

    let agentGrants = [
      { id: '@work-agent', name: '主力工作 Agent', canRead: true, canWrite: true },
      { id: '@ci-watcher', name: '构建巡检 Bot', canRead: false, canWrite: false }
    ];

    let events = [
      {
        id: 1,
        date: localDateIso(0),
        start: '09:30',
        end: '10:15',
        title: '产品与架构周晨会',
        location: 'Room 402',
        repeat: '工作日',
        reminder: 'alarm',
        source: 'local'
      },
      {
        id: 2,
        date: localDateIso(0),
        start: '14:00',
        end: '15:30',
        title: 'Pocket Cloud 第一期接口联调',
        location: '本地工作台',
        repeat: '不重复',
        reminder: 'notify',
        source: '@work-agent'
      },
      {
        id: 5,
        date: localDateIso(0),
        start: '17:00',
        end: '17:45',
        title: '代码走查与版本归档',
        location: '线上语音',
        repeat: '不重复',
        reminder: 'none',
        source: 'local'
      },
      {
        id: 3,
        date: localDateIso(1),
        start: '10:30',
        end: '11:30',
        title: '牙科复诊预约',
        location: '市中心门诊 3F',
        repeat: '不重复',
        reminder: 'alarm',
        source: 'local'
      },
      {
        id: 4,
        date: localDateIso(3),
        start: '08:00',
        end: '09:20',
        title: '虹桥站 G12 次检票进站',
        location: '12B 检票口',
        repeat: '不重复',
        reminder: 'alarm',
        source: 'local'

    ];

    /* 统一 Todo 模型：单次事项用 done 复选框；周期事项用 enabled 拨码开关（支持 locked 本机锁与 skipNext） */
    let todos = [
      {
        id: 201,
        text: '早起晨间洗漱与出发准备',
        target: '@me',
        time: '07:30',
        schedule: '工作日',
        date: '',
        done: false,
        enabled: true,
        locked: true,
        skipNext: false,
        receipt: ''
      },
      {
        id: 202,
        text: '整理本周日程与进展，生成复盘摘要',
        target: '@work-agent',
        time: '16:00',
        schedule: '每周五',
        date: '',
        done: false,
        enabled: true,
        locked: false,
        skipNext: false,
        receipt: '已生成 4 条要点并写入周报会话 (16:01)'
      },
      {
        id: 203,
        text: '带身份证去虹桥站赶早班高铁',
        target: '@me',
        time: '06:40',
        schedule: '指定日期',
        date: localDateIso(3),
        done: false,
        enabled: true,
        locked: false,
        skipNext: false,
        receipt: ''
      },
      {
        id: 204,
        text: '补充私有云部署环境变量说明',
        target: 'none',
        time: '',
        schedule: '',
        date: '',
        done: false,
        enabled: true,
        locked: false,
        skipNext: false,
        receipt: ''
      }
    ];

    function isRecurring(item) {
      return item.target !== 'none' && recurringSet.has(item.schedule);
    }

    function isItemActive(item) {
      return isRecurring(item) ? item.enabled : !item.done;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    function toast(message) {
      const el = document.querySelector('#toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 1800);
    }

    function toMinutes(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function eventTimestamp(ev) {
      const [yy, mm, dd] = ev.date.split('-').map(Number);
      const [hh, min] = ev.start.split(':').map(Number);
      return new Date(yy, mm - 1, dd, hh, min, 0, 0).getTime();
    }

    function eventEndTimestamp(ev) {
      const [yy, mm, dd] = ev.date.split('-').map(Number);
      const [hh, min] = ev.end.split(':').map(Number);
      return new Date(yy, mm - 1, dd, hh, min, 0, 0).getTime();
    }

    function formatDelta(ms) {
      const mins = Math.max(1, Math.round(ms / 60000));
      return `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}m`;
    }

    function conflictingIdsForDate(dateIso) {
      const dayList = events.filter((e) => e.date === dateIso);
      const set = new Set();
      for (let i = 0; i < dayList.length; i += 1) {
        for (let j = i + 1; j < dayList.length; j += 1) {
          const a = dayList[i];
          const b = dayList[j];
          if (toMinutes(a.start) < toMinutes(b.end) && toMinutes(b.start) < toMinutes(a.end)) {
            set.add(a.id);
            set.add(b.id);
          }
        }
      }
      return set;
    }

    function parseInlineTokens(rawText) {
      let target = null;
      let time = null;
      const knownHandles = ['@me', ...agentGrants.map((a) => a.id)];
      for (const h of knownHandles) {
        if (rawText.includes(h)) {
          target = h;
          break;
        }
      }
      const timeMatch = /\b([01]?\d|2[0-3]):([0-5]\d)\b/.exec(rawText);
      if (timeMatch) {
        time = `${timeMatch[1].padStart(2, '0')}:${timeMatch[2]}`;
      }
      return { target, time };
    }

    function cleanInlineTokens(rawText) {
      const handlesPattern = /@(me|work-agent|ci-watcher)\b/g;
      return rawText
        .replace(handlesPattern, '')
        .replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function formatTodoSub(item) {
      if (item.target === 'none') {
        return item.done ? '已完成' : '普通待办 · 不设唤醒';
      }
      const whenLabel = item.schedule === '指定日期' && item.date
        ? item.date.slice(5)
        : item.schedule;
      if (item.target === '@me') {
        if (isRecurring(item) && !item.enabled) {
          return `${whenLabel} · 已暂停`;
        }
        const parts = [whenLabel, '本机闹钟 EXECUTED'];
        if (item.skipNext) {
          parts.push('已跳过下次');
        }
        if (item.locked) {
          parts.push('LOCKED 本机锁');
        }
        return parts.join(' · ');
      }
      if (isRecurring(item)) {
        if (!item.enabled) {
          return `${whenLabel} · 已暂停`;
        }
        const cron = PocketAgent.cronExpression(item.schedule, item.time);
        return `cron ${cron} · ${item.receipt ? '202 COMPLETED' : 'SCHEDULED'}`;
      }
      return `${whenLabel} ${item.time} · SCHEDULED`;
    }

    function renderTtyBar() {
      const pathEl = document.querySelector('#tty-path');
      const statEl = document.querySelector('#tty-stat');
      const slug = pageMeta[current][1].slice(1);
      pathEl.innerHTML = `<b>$</b>pocket/${slug}`;
      if (current === 'todo') {
        const meCount = todos.filter((t) => isItemActive(t) && t.target === '@me').length;
        const agCount = todos.filter((t) => isItemActive(t) && t.target.startsWith('@') && t.target !== '@me').length;
        statEl.innerHTML = `<i class="dot ok"></i>@me ${meCount} · @agent ${agCount}`;
        return;
      }
      const todayCount = events.filter((e) => e.date === localDateIso(0)).length;
      statEl.innerHTML = cloudOnline
        ? `<i class="dot ok"></i>online · today ${todayCount}`
        : '<i class="dot off"></i>offline';
    }

    function buildIntervalBraille(charCols, charRows, dayEvents, timedTodos) {
      const subW = charCols * 2;
      const subH = charRows * 4;
      const grid = Array.from({ length: charRows }, () => Array(charCols).fill(0));
      const overlay = new Map();

      const setDot = (sx, sy) => {
        if (sx < 0 || sx >= subW || sy < 0 || sy >= subH) {
          return;
        }
        const cx = Math.floor(sx / 2);
        const cy = Math.floor(sy / 4);
        const bit = sx % 2 === 0 ? brailleLeft[sy % 4] : brailleRight[sy % 4];
        grid[cy][cx] |= bit;
      };

      for (let sx = 0; sx < subW; sx += 2) {
        setDot(sx, subH - 3);
      }
      for (let h = 0; h <= 24; h += 6) {
        const tx = Math.min(subW - 1, Math.round((h / 24) * (subW - 1)));
        setDot(tx, subH - 4);
        setDot(tx, subH - 2);
      }

      if (current === 'todo') {
        timedTodos.forEach((td) => {
          const sx = Math.min(subW - 1, Math.round((toMinutes(td.time) / 1440) * (subW - 1)));
          for (let y = 3; y <= subH - 3; y += 1) {
            setDot(sx, y);
          }
          const key = `0:${Math.floor(sx / 2)}`;
          overlay.set(key, td.target === '@me' ? '<span class="mark">◆</span>' : '<span class="hi">●</span>');
        });
      } else {
        dayEvents.forEach((ev, idx) => {
          const x1 = Math.max(0, Math.round((toMinutes(ev.start) / 1440) * (subW - 1)));
          const x2 = Math.min(subW - 1, Math.max(x1 + 2, Math.round((toMinutes(ev.end) / 1440) * (subW - 1))));
          const rowBand = 3 + (idx % 3) * 4;
          for (let x = x1; x <= x2; x += 1) {
            setDot(x, rowBand);
            setDot(x, rowBand + 1);
          }
          const cKey = `${Math.floor(rowBand / 4)}:${Math.floor(x1 / 2)}`;
          if (!overlay.has(cKey)) {
            overlay.set(
              cKey,
              ev.reminder === 'alarm' ? '<span class="mark">◆</span>' : '<span class="hi">▪</span>'
            );
          }
        });
      }

      return grid.map((row, r) => row.map((mask, c) => {
        const k = `${r}:${c}`;
        if (overlay.has(k)) {
          return overlay.get(k);
        }
        return mask === 0 ? ' ' : String.fromCodePoint(0x2800 + mask);
      }).join(''));
    }

    function renderAsciiUnderlay() {
      const canvas = document.querySelector('#ascii-canvas');
      if (!canvas) {
        return;
      }
      const focusDate = current === 'month' ? selectedDate : localDateIso(0);
      const dayEvents = events
        .filter((e) => e.date === focusDate)
        .sort((a, b) => a.start.localeCompare(b.start));
      const timedTodos = todos.filter((t) => isItemActive(t) && t.target !== 'none' && t.time);
      const bandLines = buildIntervalBraille(48, 4, dayEvents, timedTodos);
      const conflicts = conflictingIdsForDate(focusDate);
      const overlapCount = dayEvents.filter((e) => conflicts.has(e.id)).length;

      const eq1 = current === 'todo'
        ? 'route: Todo ↦ { ∅, @me ↦ alarm, @agent ↦ post }'
        : `w ≡ (d + ⌊13(m+1)/5⌋ + K) mod 7     date = ${focusDate}`;
      const recurringActive = todos.filter((t) => isRecurring(t) && t.enabled).length;
      const oneOffOpen = todos.filter((t) => !isRecurring(t) && !t.done).length;
      const eq2 = current === 'todo'
        ? `|todo| = ${oneOffOpen},  |cycle| = ${recurringActive}   ◆=@me  ●=@agent`
        : overlapCount > 0
          ? `Iₖ = [sₖ, eₖ)   ⋂ Iₖ ≠ ∅ (${overlapCount} overlapping)`
          : `Iₖ = [sₖ, eₖ),  ∀i≠j: Iᵢ ∩ Iⱼ = ∅   (|I| = ${dayEvents.length})`;

      const totalRows = 38;
      const lines = [];
      for (let r = 1; r <= totalRows; r += 1) {
        const axis = r % 6 === 0 ? `w${r / 6}` : String(r).padStart(2, '0');
        if (r <= 29) {
          lines.push(`${axis}│`);
        } else if (r === 30) {
          lines.push(`${axis}│   ∶       +       ·       ≡       ·       +       ∶`);
        } else if (r === 31) {
          lines.push(`${axis}│  <span class="hi">${eq1}</span>`);
        } else if (r >= 32 && r <= 35) {
          lines.push(`${axis}│   ${bandLines[r - 32]}`);
        } else if (r === 36) {
          lines.push(`${axis}│   00h         06h         12h         18h        24h`);
        } else if (r === 37) {
          lines.push(`${axis}│  <span class="${overlapCount && current !== 'todo' ? 'mark' : 'hi'}">${eq2}</span>`);
        } else {
          lines.push(`${axis}│   ·       ∶       ∆       ·       ∈       ∶       ·`);
        }
      }
      canvas.innerHTML = lines.join('\n');
    }

    function reminderBadge(ev) {
      if (ev.reminder === 'alarm') {
        return '<span class="mark-tag lock">强提醒响铃</span>';
      }
      if (ev.reminder === 'notify') {
        return '<span class="mark-tag neutral">通知 -10m</span>';
      }
      return '';
    }

    function agendaPage() {
      const todayIso = localDateIso(0);
      const todayList = events
        .filter((e) => e.date === todayIso)
        .sort((a, b) => a.start.localeCompare(b.start));
      const conflicts = conflictingIdsForDate(todayIso);
      const now = Date.now();
      const next = todayList.find((ev) => eventEndTimestamp(ev) >= now) || todayList[0] || null;
      const others = todayList.filter((ev) => ev.id !== next?.id);

      const hero = next
        ? (() => {
            const diffMs = eventTimestamp(next) - now;
            const headText = diffMs > 0
              ? `<b>${formatDelta(diffMs)}</b> 后开始 · 今日下一场`
              : eventEndTimestamp(next) >= now
                ? '正在进行 · 今日当前日程'
                : '今日日程';
            const statusInfo = next.reminder === 'alarm'
              ? '<span class="receipt-code"><i class="dot ok"></i>ALARM EXECUTED</span>'
              : '<span class="receipt-code"><i class="dot ok"></i>TODAY</span>';
            return `<article class="hero">
              <div class="hero-top">
                <span class="t-minus"><i class="dot mark"></i>${headText}</span>
                ${reminderBadge(next) || '<span class="mark-tag neutral">静默日程</span>'}
              </div>
              <div class="hero-mid">
                <button class="hero-main-btn" type="button" data-edit="${next.id}">
                  <span class="hero-range">${escapeHtml(next.start)}–${escapeHtml(next.end)}</span>
                </button>
              </div>
              <div class="hero-foot">
                <div class="hero-name">${escapeHtml(next.title)} <span>${escapeHtml(next.location || next.repeat)}</span></div>
                ${statusInfo}
              </div>
            </article>`;
          })()
        : `<div class="empty">今天（${todayIso}）没有日程安排<br><button class="cmd-quiet outlined" type="button" data-open-event>+ 新建今日日程</button></div>`;

      const rows = others.map((ev) => {
        const tags = [];
        if (conflicts.has(ev.id)) {
          tags.push('<span class="mark-tag lock">时间重叠</span>');
        }
        const rem = reminderBadge(ev);
        if (rem) {
          tags.push(rem);
        }
        if (ev.source.startsWith('@')) {
          tags.push(`<span class="mark-tag neutral">${escapeHtml(ev.source)}</span>`);
        }
        return `<article class="row">
          <button class="row-btn event-grid" type="button" data-edit="${ev.id}">
            <span class="row-span">${escapeHtml(ev.start)}–${escapeHtml(ev.end)}<small>今天</small></span>
            <span>
              <span class="row-title">${escapeHtml(ev.title)} ${tags.join(' ')}</span>
              <span class="row-meta">${escapeHtml(ev.location || '无地点')} · ${escapeHtml(ev.repeat)}</span>
            </span>
          </button>
        </article>`;
      }).join('');

      return `<div class="foreground-stack">
        ${hero}
        <div class="col-head"><span>TODAY · ${todayIso} (其余 ${others.length} 场)</span><span>REMINDER</span></div>
        <div class="rows">${rows || '<div class="row" style="padding:14px 2px"><span class="row-meta">今日其余时段空闲（跨天日程在 [m] 月历查看）</span></div>'}</div>
      </div>`;
    }

    function buildMonthCells(year, month) {
      const firstDay = new Date(year, month, 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();
      const cells = [];

      for (let i = startOffset - 1; i >= 0; i -= 1) {
        const d = new Date(year, month - 1, prevDays - i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        cells.push({ iso, day: d.getDate(), outside: true });
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        cells.push({ iso, day, outside: false });
      }
      while (cells.length % 7 !== 0) {
        const nextIdx = cells.length - (startOffset + daysInMonth) + 1;
        const d = new Date(year, month + 1, nextIdx);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        cells.push({ iso, day: d.getDate(), outside: true });
      }
      return cells;
    }

    function monthPage() {
      const today = localDateIso(0);
      const cells = buildMonthCells(viewYear, viewMonth);
      const monthLabel = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}`;
      const conflicts = conflictingIdsForDate(selectedDate);

      const gridHtml = cells.map((cell) => {
        const dayEvents = events.filter((e) => e.date === cell.iso);
        const dots = dayEvents.slice(0, 3).map((e) => (
          `<i class="${e.reminder === 'alarm' ? 'strong' : 'normal'}"></i>`
        )).join('');
        const cls = [
          'cal-cell',
          cell.outside ? 'outside' : '',
          cell.iso === today ? 'today' : ''
        ].filter(Boolean).join(' ');
        return `<button class="${cls}" type="button" data-pick-date="${cell.iso}" aria-selected="${cell.iso === selectedDate}">
          <span>${String(cell.day).padStart(2, '0')}</span>
          <span class="cal-dots">${dots}</span>
        </button>`;
      }).join('');

      const selectedEvents = events
        .filter((e) => e.date === selectedDate)
        .sort((a, b) => a.start.localeCompare(b.start));

      const dayRows = selectedEvents.map((ev) => {
        const badge = conflicts.has(ev.id)
          ? '<span class="mark-tag lock">时间重叠</span>'
          : reminderBadge(ev);
        return `<article class="row">
          <button class="row-btn event-grid" type="button" data-edit="${ev.id}">
            <span class="row-span">${escapeHtml(ev.start)}–${escapeHtml(ev.end)}</span>
            <span>
              <span class="row-title">${escapeHtml(ev.title)} ${badge}</span>
              <span class="row-meta">${escapeHtml(ev.location || '无地点')} · ${escapeHtml(ev.repeat)}</span>
            </span>
          </button>
        </article>`;
      }).join('');

      return `<div class="foreground-stack">
        <div class="cal-card">
          <div class="cal-toolbar">
            <button class="cmd-quiet outlined mini" type="button" data-month-step="-1">← prev</button>
            <span class="cal-month-label">${monthLabel}</span>
            <div class="date-shortcuts">
              <button class="cmd-quiet outlined mini" type="button" data-month-today>today</button>
              <button class="cmd-quiet outlined mini" type="button" data-month-step="1">next →</button>
            </div>
          </div>
          <div class="cal-weekdays">${weekShort.map((w) => `<span>${w}</span>`).join('')}</div>
          <div class="cal-grid">${gridHtml}</div>
        </div>

        <div class="col-head">
          <span>${escapeHtml(selectedDate)} (${selectedEvents.length})</span>
          <button class="cmd-quiet outlined mini" type="button" data-open-event>+ 在该日新建</button>
        </div>
        <div class="rows">${dayRows || '<div class="row" style="padding:14px 2px"><span class="row-meta">当日暂无日程安排</span></div>'}</div>
      </div>`;
    }

    function todoPage() {
      const targets = [
        ['none', '仅待办', ''],
        ['@me', '@me 响铃', 'me'],
        ...agentGrants.map((a) => [a.id, a.id, ''])
      ];
      const pills = targets.map(([id, label, cls]) => (
        `<button class="route-pill ${cls}" type="button" data-quick-target="${escapeHtml(id)}" aria-pressed="${quickTarget === id}">${escapeHtml(label)}</button>`
      )).join('');

      const dateExtra = quickSchedule === '指定日期'
        ? `<input id="quick-date" type="date" value="${escapeHtml(quickDate)}" aria-label="指定日期">`
        : '';
      const whenRow = quickTarget !== 'none'
        ? `<div class="composer-when">
            <span>${quickTarget === '@me' ? '→ 本机准点响铃' : `→ 云端发给 ${escapeHtml(quickTarget)}`}</span>
            <div class="date-shortcuts">
              <select id="quick-schedule" aria-label="触发周期">
                ${['今天', '明天', '指定日期', '每天', '工作日', '每周五'].map((s) => `<option value="${s}" ${s === quickSchedule ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              ${dateExtra}
              <input id="quick-time" type="time" value="${escapeHtml(quickTime)}" aria-label="触发时间">
            </div>
          </div>`
        : '';

      const sortedTodos = [...todos].sort((a, b) => Number(!isItemActive(a)) - Number(!isItemActive(b)));
      const todoRows = sortedTodos.map((item) => {
        const recurring = isRecurring(item);
        let routeTag = '';
        if (item.target === '@me') {
          routeTag = `<span class="mark-tag lock">@me · ${escapeHtml(item.time)} 响铃</span>`;
        } else if (item.target !== 'none') {
          routeTag = `<span class="mark-tag neutral">${escapeHtml(item.target)} · ${escapeHtml(item.time)}</span>`;
        }
        const receiptHtml = item.receipt
          ? `<div class="todo-receipt">↳ ${escapeHtml(item.receipt)}</div>`
          : '';
        const leftControl = recurring
          ? `<button class="todo-switch" type="button" aria-label="启停${escapeHtml(item.text)}" aria-pressed="${item.enabled}" data-switch-todo="${item.id}">${item.enabled ? 'ON' : 'OFF'}</button>`
          : `<button class="todo-check" type="button" aria-label="完成${escapeHtml(item.text)}" aria-pressed="${item.done}" data-toggle-todo="${item.id}">${item.done ? '✓' : ''}</button>`;
        const stateCls = recurring
          ? (item.enabled ? '' : 'paused')
          : (item.done ? 'done' : '');

        return `<article class="todo-row ${stateCls}">
          ${leftControl}
          <button class="todo-body-btn" type="button" data-edit-todo="${item.id}">
            <div class="todo-head">
              <span class="todo-title">${escapeHtml(item.text)}</span>
              ${routeTag}
            </div>
            <span class="todo-sub">${escapeHtml(formatTodoSub(item))}</span>
            ${receiptHtml}
          </button>
        </article>`;
      }).join('');

      const openOneOff = todos.filter((t) => !isRecurring(t) && !t.done).length;
      const activeCycles = todos.filter((t) => isRecurring(t) && t.enabled).length;

      return `<div class="foreground-stack">
        <form class="composer-card" id="quick-todo-form">
          <div class="composer-top">
            <input class="composer-input" id="quick-todo-input" placeholder="写待办，或输入 @me / @agent 16:00…" value="${escapeHtml(quickText)}" autocomplete="off" required>
            <button class="cmd-primary" type="submit">↵ 添加</button>
          </div>
          <div class="composer-bar">
            <div class="route-pills">${pills}</div>
          </div>
          ${whenRow}
        </form>

        <div class="col-head">
          <span>OPEN ${openOneOff} · CYCLES ${activeCycles}</span>
          <span>ASSIGNEE / ROUTE</span>
        </div>
        <div class="rows">${todoRows}</div>
      </div>`;
    }

    function settingsPage() {
      const grantsHtml = agentGrants.map((ag) => `<article class="job-card">
        <div class="jc-head">
          <span class="jc-target"><b>${escapeHtml(ag.id)}</b> · ${escapeHtml(ag.name)}</span>
          <div class="date-shortcuts">
            <button class="dip-switch" type="button" aria-pressed="${ag.canRead}" data-grant-read="${escapeHtml(ag.id)}"><i></i>READ</button>
            <button class="dip-switch" type="button" aria-pressed="${ag.canWrite}" data-grant-write="${escapeHtml(ag.id)}"><i></i>WRITE</button>
          </div>
        </div>
        <div class="jc-spec">绑定后可在 Todo 中被 @ 指派，并按授权拉取日程</div>
      </article>`).join('');

      return `<div class="foreground-stack">
        <article class="hero">
          <div class="hero-top">
            <span class="t-minus">DEVICE ALARM ENGINE</span>
            <span class="receipt-code"><i class="dot ${cloudOnline ? 'ok' : 'off'}"></i>${cloudOnline ? 'ONLINE' : 'OFFLINE'}</span>
          </div>
          <div class="jc-spec">全屏锁屏唤醒（关闭 / 10m 贪睡） · 重启未解锁恢复 · 权限状态自检已就绪</div>
        </article>

        <div class="col-head"><span>BOUND AGENTS</span><span>PERMISSIONS</span></div>
        <div class="jobs">${grantsHtml}</div>
      </div>`;
    }

    function render(page = current, animate = false) {
      current = page;
      if (page !== 'settings') {
        lastMainPage = page;
      }
      const [title, sub, cta] = pageMeta[page];
      document.querySelector('#page-title').textContent = title;
      document.querySelector('#page-sub').textContent = sub;
      renderTtyBar();
      renderAsciiUnderlay();

      content.innerHTML = ({
        agenda: agendaPage,
        month: monthPage,
        todo: todoPage,
        settings: settingsPage
      })[page]();

      if (animate) {
        content.classList.remove('view-enter');
        void content.offsetWidth;
        content.classList.add('view-enter');
      }

      bottomNav.innerHTML = navItems.map(([id, label, key]) => (
        `<button class="nav-item" type="button" data-page="${id}" ${page === id ? 'aria-current="page"' : ''}><kbd>[${key}]</kbd><span>${label}</span></button>`
      )).join('');

      document.querySelector('#settings-button').hidden = page === 'settings';
      backButton.hidden = page !== 'settings';
      createButton.hidden = !cta;
      if (cta) {
        createButton.textContent = cta;
      }
    }

    function navigate(page, push = true) {
      if (push) {
        history.pushState({ page }, '', `?page=${page}`);
      }
      render(page, true);
    }

    function updateDialogPreview() {
      const box = form.querySelector('#cli-preview');
      if (!box) {
        return;
      }
      if (form.dataset.kind === 'todo') {
        const target = form.querySelector('input[name="target"]:checked')?.value || 'none';
        const timeWrap = form.querySelector('[data-todo-when]');
        const sched = form.querySelector('input[name="schedule"]:checked')?.value || '今天';
        const dateWrap = form.querySelector('[data-todo-date]');
        const lockWrap = form.querySelector('[data-todo-lock]');
        if (timeWrap) {
          timeWrap.hidden = target === 'none';
        }
        if (dateWrap) {
          dateWrap.hidden = target === 'none' || sched !== '指定日期';
        }
        if (lockWrap) {
          lockWrap.hidden = target !== '@me';
        }
        if (target === 'none') {
          box.innerHTML = '<b>$</b> todo.set --plain (仅待办，不设唤醒)';
          return;
        }
        const time = form.querySelector('#td-time')?.value || '09:00';
        const dateLabel = sched === '指定日期'
          ? (form.querySelector('#td-date')?.value || localDateIso(1))
          : sched;
        const locked = form.querySelector('#td-locked')?.checked ? ' --locked' : '';
        if (target === '@me') {
          box.innerHTML = `<b>$</b> todo.set --assign <b>@me</b> --at "${escapeHtml(dateLabel)} ${escapeHtml(time)}"${locked}`;
        } else {
          box.innerHTML = `<b>$</b> todo.set --assign <b>${escapeHtml(target)}</b> --at "${escapeHtml(dateLabel)} ${escapeHtml(time)}" → post`;
        }
        return;
      }
      const date = form.querySelector('#ev-date')?.value || selectedDate;
      const start = form.querySelector('#ev-start')?.value || '09:00';
      const end = form.querySelector('#ev-end')?.value || '10:00';
      const rem = form.querySelector('input[name="reminder"]:checked')?.value || 'notify';
      const flag = rem === 'alarm'
        ? '--alarm -15m'
        : rem === 'notify'
          ? '--notify -10m'
          : '--silent';
      box.innerHTML = `<b>$</b> event.set --date ${escapeHtml(date)} --window ${escapeHtml(start)}..${escapeHtml(end)} ${flag}`;
    }

    function openEventDialog(editId = null) {
      editingEvent = editId;
      form.dataset.kind = 'event';
      const existing = editingEvent ? events.find((e) => e.id === editingEvent) : null;
      document.querySelector('#dialog-title').textContent = existing ? '编辑日程' : '新建日程';
      const dateVal = existing ? existing.date : (current === 'agenda' ? localDateIso(0) : selectedDate);
      const startVal = existing ? existing.start : '10:00';
      const endVal = existing ? existing.end : '11:00';
      const titleVal = existing ? existing.title : '';
      const locVal = existing ? existing.location : '';
      const repeatVal = existing ? existing.repeat : '不重复';
      const remVal = existing ? existing.reminder : 'notify';

      form.innerHTML = `
        <div class="field">
          <label for="ev-date">DATE</label>
          <div class="date-row">
            <input class="date-input" id="ev-date" name="date" type="date" value="${escapeHtml(dateVal)}" required>
            <div class="date-shortcuts">
              <button class="cmd-quiet outlined mini" type="button" data-date-offset="0">今天</button>
              <button class="cmd-quiet outlined mini" type="button" data-date-offset="1">明天</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label>TIME WINDOW</label>
          <div class="time-range-row">
            <input class="time-compact" id="ev-start" name="start" type="time" value="${escapeHtml(startVal)}" required>
            <span class="range-sep">→</span>
            <input class="time-compact" id="ev-end" name="end" type="time" value="${escapeHtml(endVal)}" required>
          </div>
        </div>
        <div class="field"><label for="ev-title">TITLE</label><input id="ev-title" name="title" placeholder="例如：评审会议 / 高铁检票" value="${escapeHtml(titleVal)}" required></div>
        <div class="field"><label for="ev-loc">LOCATION / NOTE</label><input id="ev-loc" name="location" placeholder="可选地点或说明" value="${escapeHtml(locVal)}"></div>
        <fieldset><legend>REPEAT</legend><div class="choices">${['不重复', '每天', '工作日', '每周'].map((r) => `<label class="choice"><input type="radio" name="repeat" value="${r}" ${r === repeatVal ? 'checked' : ''}><span>${r}</span></label>`).join('')}</div></fieldset>
        <fieldset><legend>REMINDER POLICY</legend><div class="choices">
          <label class="choice"><input type="radio" name="reminder" value="none" ${remVal === 'none' ? 'checked' : ''}><span>不提醒</span></label>
          <label class="choice"><input type="radio" name="reminder" value="notify" ${remVal === 'notify' ? 'checked' : ''}><span>普通通知 (-10m)</span></label>
          <label class="choice"><input type="radio" name="reminder" value="alarm" ${remVal === 'alarm' ? 'checked' : ''}><span>强提醒响铃 (-15m)</span></label>
        </div></fieldset>
        <div class="cli-preview" id="cli-preview" aria-live="polite"></div>
        <button class="btn-block primary" type="submit">保存日程</button>
        ${existing ? '<button class="btn-block" type="button" id="delete-event">删除日程</button>' : ''}`;
      updateDialogPreview();
      dialog.showModal();
      form.querySelector('#ev-title')?.focus();
    }

    function openTodoDialog(editId = null) {
      editingTodo = editId;
      form.dataset.kind = 'todo';
      const existing = editingTodo ? todos.find((t) => t.id === editingTodo) : null;
      document.querySelector('#dialog-title').textContent = existing ? '编辑 Todo 与唤醒对象' : '新建 Todo';
      const textVal = existing ? existing.text : '';
      const targetVal = existing ? existing.target : '@me';
      const timeVal = existing?.time || '07:30';
      const schedVal = existing?.schedule || '工作日';
      const dateVal = existing?.date || localDateIso(1);
      const lockedVal = Boolean(existing?.locked);
      const canSkip = Boolean(existing && isRecurring(existing) && existing.enabled);
      const targets = [
        ['none', '仅待办 (不定时)'],
        ['@me', '@me 手机响铃'],
        ...agentGrants.map((a) => [a.id, `${a.id} 自动执行`])
      ];

      form.innerHTML = `
        <div class="field">
          <label for="td-text">TODO / PROMPT (选 @agent 时直接作为发送正文)</label>
          <textarea class="prompt-input" id="td-text" name="text" placeholder="要做的事…" required>${escapeHtml(textVal)}</textarea>
        </div>
        <fieldset>
          <legend>ASSIGNEE · 到点唤醒谁</legend>
          <div class="choices">
            ${targets.map(([id, label]) => `<label class="choice"><input type="radio" name="target" value="${escapeHtml(id)}" ${targetVal === id ? 'checked' : ''}><span>${escapeHtml(label)}</span></label>`).join('')}
          </div>
        </fieldset>
        <div class="field" data-todo-when>
          <label for="td-time">WHEN · 触发时间与周期</label>
          <input class="time-input" id="td-time" name="time" type="time" value="${escapeHtml(timeVal)}">
          <div class="choices" style="margin-top:6px">
            ${['今天', '明天', '指定日期', '每天', '工作日', '每周五'].map((s) => `<label class="choice"><input type="radio" name="schedule" value="${s}" ${schedVal === s ? 'checked' : ''}><span>${s}</span></label></label>`).join('').replace(/<\/label><\/label>/g, '</label>')}
          </div>
        </div>
        <div class="field" data-todo-date>
          <label for="td-date">DATE · 指定触发日期</label>
          <input class="date-input" id="td-date" name="date" type="date" value="${escapeHtml(dateVal)}">
        </div>
        <div class="field" data-todo-lock>
          <label class="choice"><input type="checkbox" id="td-locked" name="locked" ${lockedVal ? 'checked' : ''}><span>LOCKED 本机锁（禁止远程或 Agent 修改此闹钟）</span></label>
        </div>
        <div class="cli-preview" id="cli-preview" aria-live="polite"></div>
        <button class="btn-block primary" type="submit">保存</button>
        ${canSkip ? `<button class="btn-block" type="button" id="skip-next-todo">${existing.skipNext ? '恢复下次触发' : '跳过下一次'}</button>` : ''}
        ${existing ? '<button class="btn-block" type="button" id="delete-todo">删除</button>' : ''}`;
      updateDialogPreview();
      dialog.showModal();
      form.querySelector('#td-text')?.focus();
    }

    bottomNav.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-page]');
      if (btn) {
        navigate(btn.dataset.page);
      }
    });

    document.querySelector('#settings-button').addEventListener('click', () => navigate('settings'));
    backButton.addEventListener('click', () => navigate(lastMainPage));
    document.querySelector('#theme-toggle').addEventListener('click', () => {
      document.body.dataset.theme = document.body.dataset.theme === 'black' ? 'white' : 'black';
    });
    createButton.addEventListener('click', () => {
      if (current === 'todo') {
        openTodoDialog(null);
      } else {
        openEventDialog(null);
      }
    });
    document.querySelector('#dialog-close').addEventListener('click', () => dialog.close());

    content.addEventListener('input', (event) => {
      if (event.target.id === 'quick-todo-input') {
        quickText = event.target.value;
        const parsed = parseInlineTokens(quickText);
        let changed = false;
        if (parsed.target && parsed.target !== quickTarget) {
          quickTarget = parsed.target;
          changed = true;
        }
        if (parsed.time && parsed.time !== quickTime) {
          quickTime = parsed.time;
          const timeEl = document.querySelector('#quick-time');
          if (timeEl) {
            timeEl.value = quickTime;
          } else {
            changed = true;
          }
        }
        if (changed) {
          const pos = event.target.selectionStart;
          render('todo');
          const nextInput = document.querySelector('#quick-todo-input');
          if (nextInput) {
            nextInput.focus();
            nextInput.setSelectionRange(pos, pos);
          }
        }
      } else if (event.target.id === 'quick-time') {
        quickTime = event.target.value;
      } else if (event.target.id === 'quick-schedule') {
        quickSchedule = event.target.value;
        render('todo');
      } else if (event.target.id === 'quick-date') {
        quickDate = event.target.value;
      }
    });

    content.addEventListener('submit', (event) => {
      if (event.target.id !== 'quick-todo-form') {
        return;
      }
      event.preventDefault();
      const cleaned = cleanInlineTokens(quickText) || quickText.trim();
      if (!cleaned) {
        return;
      }
      todos.unshift({
        id: Date.now(),
        text: cleaned,
        target: quickTarget,
        time: quickTarget === 'none' ? '' : quickTime,
        schedule: quickTarget === 'none' ? '' : quickSchedule,
        date: quickTarget !== 'none' && quickSchedule === '指定日期' ? quickDate : '',
        done: false,
        enabled: true,
        locked: false,
        skipNext: false,
        receipt: ''
      });
      const routeNote = quickTarget === '@me'
        ? '已设为本机闹钟'
        : quickTarget === 'none'
          ? '已添加待办'
          : `已指派给 ${quickTarget}`;
      quickText = '';
      render('todo');
      toast(routeNote);
    });

    content.addEventListener('click', (event) => {
      const edit = event.target.closest('[data-edit]');
      const openEv = event.target.closest('[data-open-event]');
      const pick = event.target.closest('[data-pick-date]');
      const step = event.target.closest('[data-month-step]');
      const todayBtn = event.target.closest('[data-month-today]');
      const qTarget = event.target.closest('[data-quick-target]');
      const toggleTodo = event.target.closest('[data-toggle-todo]');
      const switchTodo = event.target.closest('[data-switch-todo]');
      const editTodo = event.target.closest('[data-edit-todo]');
      const grantRead = event.target.closest('[data-grant-read]');
      const grantWrite = event.target.closest('[data-grant-write]');

      if (edit) {
        openEventDialog(Number(edit.dataset.edit));
      } else if (openEv) {
        openEventDialog(null);
      } else if (pick) {
        selectedDate = pick.dataset.pickDate;
        viewYear = Number(selectedDate.slice(0, 4));
        viewMonth = Number(selectedDate.slice(5, 7)) - 1;
        render('month');
      } else if (step) {
        const d = new Date(viewYear, viewMonth + Number(step.dataset.monthStep), 1);
        viewYear = d.getFullYear();
        viewMonth = d.getMonth();
        render('month');
      } else if (todayBtn) {
        selectedDate = localDateIso(0);
        viewYear = Number(selectedDate.slice(0, 4));
        viewMonth = Number(selectedDate.slice(5, 7)) - 1;
        render('month');
      } else if (qTarget) {
        quickTarget = qTarget.dataset.quickTarget;
        render('todo');
      } else if (toggleTodo) {
        const item = todos.find((t) => t.id === Number(toggleTodo.dataset.toggleTodo));
        if (item) {
          item.done = !item.done;
          render('todo');
        }
      } else if (switchTodo) {
        const item = todos.find((t) => t.id === Number(switchTodo.dataset.switchTodo));
        if (item) {
          item.enabled = !item.enabled;
          if (!item.enabled) {
            item.skipNext = false;
          }
          render('todo');
        }
      } else if (editTodo) {
        openTodoDialog(Number(editTodo.dataset.editTodo));
      } else if (grantRead) {
        const ag = agentGrants.find((g) => g.id === grantRead.dataset.grantRead);
        if (ag) {
          ag.canRead = !ag.canRead;
          render('settings');
        }
      } else if (grantWrite) {
        const ag = agentGrants.find((g) => g.id === grantWrite.dataset.grantWrite);
        if (ag) {
          ag.canWrite = !ag.canWrite;
          render('settings');
        }
      }
    });

    form.addEventListener('input', updateDialogPreview);
    form.addEventListener('change', updateDialogPreview);
    form.addEventListener('click', (event) => {
      const quick = event.target.closest('[data-date-offset]');
      if (quick) {
        const input = form.querySelector('#ev-date');
        if (input) {
          input.value = localDateIso(Number(quick.dataset.dateOffset));
          updateDialogPreview();
        }
        return;
      }
      if (event.target.closest('#skip-next-todo')) {
        const item = todos.find((t) => t.id === editingTodo);
        if (item) {
          item.skipNext = !item.skipNext;
          dialog.close();
          render('todo');
          toast(item.skipNext ? '已跳过下一次触发' : '已恢复下一次触发');
        }
        return;
      }
      if (event.target.closest('#delete-event')) {
        events = events.filter((e) => e.id !== editingEvent);
        dialog.close();
        render(current);
        toast('日程已删除');
        return;
      }
      if (event.target.closest('#delete-todo')) {
        todos = todos.filter((t) => t.id !== editingTodo);
        dialog.close();
        render('todo');
        toast('已删除');
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(form);
      if (form.dataset.kind === 'todo') {
        const target = String(data.get('target') || 'none');
        const time = target === 'none' ? '' : String(data.get('time') || '09:00');
        const schedule = target === 'none' ? '' : String(data.get('schedule') || '今天');
        const date = target !== 'none' && schedule === '指定日期'
          ? String(data.get('date') || localDateIso(1))
          : '';
        const locked = target === '@me' && Boolean(data.get('locked'));
        const payload = {
          text: String(data.get('text') || '').trim(),
          target,
          time,
          schedule,
          date,
          locked
        };
        if (editingTodo) {
          const item = todos.find((t) => t.id === editingTodo);
          if (item) {
            Object.assign(item, payload);
          }
        } else {
          todos.unshift({
            id: Date.now(),
            done: false,
            enabled: true,
            skipNext: false,
            receipt: '',
            ...payload
          });
        }
        dialog.close();
        render('todo');
        toast(target === '@me' ? '已保存并设为本机闹钟' : '已保存');
        return;
      }

      const start = String(data.get('start') || '09:00');
      let end = String(data.get('end') || '10:00');
      if (toMinutes(end) <= toMinutes(start)) {
        const bumped = Math.min(1439, toMinutes(start) + 30);
        end = `${String(Math.floor(bumped / 60)).padStart(2, '0')}:${String(bumped % 60).padStart(2, '0')}`;
      }
      const date = String(data.get('date') || selectedDate);
      const reminder = String(data.get('reminder') || 'notify');
      const payload = {
        date,
        start,
        end,
        title: String(data.get('title') || '日程').trim(),
        location: String(data.get('location') || '').trim(),
        repeat: String(data.get('repeat') || '不重复'),
        reminder
      };

      if (editingEvent) {
        const item = events.find((e) => e.id === editingEvent);
        if (item) {
          Object.assign(item, payload);
        }
      } else {
        events.push({ id: Date.now(), source: 'local', ...payload });
      }
      selectedDate = date;
      viewYear = Number(date.slice(0, 4));
      viewMonth = Number(date.slice(5, 7)) - 1;
      dialog.close();
      render(current === 'settings' ? 'agenda' : current);
      toast(reminder === 'alarm' ? '日程已保存，已设本机强提醒响铃' : '日程已保存');
    });

    document.addEventListener('keydown', (event) => {
      if (event.target.closest('input, select, textarea, [contenteditable]') || dialog.open) {
        return;
      }
      const key = event.key.toLowerCase();
      if (key === 'd') {
        event.preventDefault();
        navigate('agenda');
      } else if (key === 'm') {
        event.preventDefault();
        navigate('month');
      } else if (key === 't') {
        event.preventDefault();
        navigate('todo');
      } else if (key === 'n' && !createButton.hidden) {
        event.preventDefault();
        createButton.click();
      } else if (key === 'c') {
        event.preventDefault();
        navigate('settings');
      } else if (key === 'b') {
        event.preventDefault();
        document.querySelector('#theme-toggle').click();
      }
    });

    window.addEventListener('popstate', (event) => {
      render(event.state?.page || 'agenda');
    });

    const params = new URLSearchParams(location.search);
    document.body.dataset.theme = params.get('theme') === 'black' ? 'black' : 'white';
    if (params.get('motion') === 'off') {
      document.body.dataset.motion = 'off';
    }
    const initial = pageMeta[params.get('page')] ? params.get('page') : 'agenda';
    history.replaceState({ page: initial }, '', `?page=${initial}`);
    render(initial);
    if (params.get('create')) {
      if (params.get('create') === 'todo') {
        openTodoDialog(null);
      } else {
        openEventDialog(null);
      }
    }
  </script>
</body>
</html>
