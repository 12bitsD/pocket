<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9" id="theme-color-meta">
  <title>Pocket Calendar</title>
</head>
<body data-theme="white">
  <main class="phone" aria-label="Pocket Calendar">
    <div class="ascii-underlay" aria-hidden="true">
      <pre class="ascii-canvas" id="ascii-canvas"></pre>
    </div>

    <div class="tty-bar">
      <span class="tty-path" id="tty-path"><b>$</b>pocket/today</span>
      <span class="tty-stat" id="tty-stat"></span>
    </div>

    <header class="topbar">
      <div class="title-group">
        <button class="cmd-quiet outlined" id="back-button" type="button"
          aria-label="返回" hidden>← back</button>
        <h1 id="page-title" tabindex="-1">今日日程</h1>
        <span class="header-sub" id="page-sub">/today</span>
      </div>
      <div class="top-actions">
        <button class="cmd-quiet" id="theme-toggle" type="button"
          aria-label="切换深浅纸面">b/w</button>
        <button class="cmd-quiet outlined" id="settings-button"
          type="button">cfg</button>
        <button class="cmd-primary" id="create-button"
          type="button">+ event</button>
      </div>
    </header>

    <section class="content" id="content"></section>
    <nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <dialog id="form-dialog" closedby="any" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title">新建</h2>
      <button class="cmd-quiet" id="dialog-close" type="button"
        aria-label="关闭">[esc]</button>
    </div>
    <form class="dialog-body" id="active-form" method="dialog"></form>
  </dialog>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
