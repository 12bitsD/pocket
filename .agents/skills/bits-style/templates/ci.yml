name: bits-style

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bits
        run: cargo install --git https://github.com/12bitsD/bits-style --tag v0.5.0 --locked
      - name: Check changed code
        run: bits style check --diff --commit origin/main
