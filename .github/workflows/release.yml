name: release

on:
  push:
    tags:
      - 'calendar-v*'
      - 'notes-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Package client artifact
        run: bash scripts/package-app.sh "${GITHUB_REF_NAME%%-v*}" "${GITHUB_REF_NAME#*-v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/${GITHUB_REF_NAME%%-v*}-${GITHUB_REF_NAME#*-v}.zip" --title "$GITHUB_REF_NAME" --generate-notes
